<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#06101d">
<title>Geschützte Vorschau · Michel Baustoffe &amp; Transporte</title>
<link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{min-height:100vh;display:grid;place-items:center;padding:16px;color:#dbe4ef;
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  background:radial-gradient(55% 55% at 88% 10%,rgba(31,99,214,.35),transparent 62%),
    radial-gradient(45% 45% at 8% 95%,rgba(255,122,24,.2),transparent 60%),#06101d}
body.checking .card{visibility:hidden}
.card{width:min(100%,420px);padding:34px 28px 30px;border-radius:22px;background:#0b1a30;
  border:1px solid rgba(255,255,255,.1);box-shadow:0 30px 80px rgba(0,0,0,.4)}
.brand{display:flex;flex-direction:column;gap:5px;margin-bottom:26px}
.brand b{align-self:flex-start;padding:4px 12px 5px 10px;background:#ff7a18;color:#fff;font-style:italic;font-weight:900;font-size:1.45rem;letter-spacing:-.02em;transform:skewX(-10deg);border-radius:4px}
.brand span{font:600 .64rem/1.4 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.2em;text-transform:uppercase;opacity:.7}
h1{margin:0 0 6px;color:#fff;font-size:1.6rem;letter-spacing:-.02em}
p{margin:0 0 22px;line-height:1.55;color:rgba(219,228,239,.78)}
label{display:block;font-weight:700;font-size:.92rem;margin-bottom:8px}
input[type=password]{width:100%;padding:13px 14px;font:inherit;font-size:1rem;color:#0c1626;background:#fff;
  border:2px solid transparent;border-radius:12px;outline:none}
input[type=password]:focus{border-color:#ff7a18}
.remember{display:flex;align-items:center;gap:8px;font-weight:500;margin:14px 0 20px;cursor:pointer}
.remember input{width:17px;height:17px;accent-color:#ff7a18}
button{width:100%;padding:14px;border:0;border-radius:999px;background:#ff7a18;color:#06101d;font:inherit;
  font-weight:800;font-size:1rem;cursor:pointer}
button:hover{background:#ff9a47}
button:disabled{opacity:.7;cursor:wait}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.err{margin:14px 0 0;color:#ff8a80;font-weight:700}
</style>
</head>
<body class="checking">
<main class="card">
  <div class="brand"><b>Michel</b><span>Baustoffe · Transporte – Website-Vorschau</span></div>
  <h1>Geschützte Vorschau</h1>
  <p>Bitte geben Sie das Passwort ein, das Sie von uns erhalten haben.</p>
  <form id="gate">
    <label for="pw">Passwort</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <label class="remember"><input type="checkbox" id="remember" checked> Angemeldet bleiben</label>
    <button type="submit" id="go">Vorschau öffnen</button>
    <p class="err" id="err" role="alert" hidden></p>
  </form>
</main>

  const STORE = "michel-preview-key";
  const hex = (h) => new Uint8Array(h.match(/../g).map((b) => parseInt(b, 16)));
  const toHex = (buf) => Array.from(new Uint8Array(buf), (b) => b.toString(16).padStart(2, "0")).join("");
  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const store = {
    get() { try { return localStorage.getItem(STORE) || sessionStorage.getItem(STORE); } catch (e) { return null; } },
    set(k, keep) { try { (keep ? localStorage : sessionStorage).setItem(STORE, k); } catch (e) {} },
    clear() { try { localStorage.removeItem(STORE); sessionStorage.removeItem(STORE); } catch (e) {} },
  };
  const $ = (id) => document.getElementById(id);
  const fail = (msg) => { const e = $("err"); e.textContent = msg; e.hidden = false; };

  async function derive(pw) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
    return toHex(await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: hex(P.salt), iterations: P.iter }, base, 256));
  }
  async function decrypt(keyHex) {
    try {
      const key = await crypto.subtle.importKey("raw", hex(keyHex), { name: "AES-CBC" }, false, ["decrypt"]);
      const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-CBC", iv: hex(P.iv) }, key, b64(P.data)));
      return /^<!doctype html>/i.test(html) ? html : null;
    } catch (e) { return null; }
  }
  // document.open() wird ignoriert, solange der Parser noch läuft – daher erst nach "load" ersetzen
  const ready = () => new Promise((resolve) => {
    if (document.readyState === "complete") resolve();
    else window.addEventListener("load", () => setTimeout(resolve, 0), { once: true });
  });
  async function show(html) { await ready(); document.open(); document.write(html); document.close(); }

  if (!window.crypto || !crypto.subtle) {
    document.body.classList.remove("checking");
    fail("Ihr Browser unterstützt die Entschlüsselung nicht. Bitte einen aktuellen Browser verwenden.");
    return;
  }

  (async () => {
    const saved = store.get();
    if (saved) {
      const html = await decrypt(saved);
      if (html) { await show(html); return; }
      store.clear();
    }
    document.body.classList.remove("checking");
    $("pw").focus();
  })();

  $("gate").addEventListener("submit", async (e) => {
    e.preventDefault();
    $("err").hidden = true;
    $("go").disabled = true;
    $("go").textContent = "Wird geöffnet …";
    const key = await derive($("pw").value);
    const html = await decrypt(key);
    if (html) { store.set(key, $("remember").checked); await show(html); return; }
    $("go").disabled = false;
    $("go").textContent = "Vorschau öffnen";
    fail("Das Passwort ist leider nicht korrekt.");
    $("pw").select();
  });
})();
</script>
</body>
</html>
